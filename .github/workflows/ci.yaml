name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_TOKEN: ${{ secrets.TOKEN }}
      BATON_USER_STATUS: ${{ vars.USER_STATUS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build baton-hubspot
        run: go build ./cmd/baton-hubspot
      - name: Grant/Revoke Team
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-hubspot
          baton-entitlement: ${{ vars.CI_TEAM_ENTITLEMENT }}
          baton-principal: ${{ vars.CI_TEAM_PRINCIPAL }}
          baton-principal-type: user
      - name: Grant/Revoke Role
        uses: ConductorOne/github-workflows/actions/sync-test@v4
        with:
          connector: ./baton-hubspot
          baton-entitlement: ${{ vars.CI_ROLE_ENTITLEMENT }}
          baton-principal: ${{ vars.CI_ROLE_PRINCIPAL }}
          baton-principal-type: user
      - name: Create/Delete User Account
        uses: ConductorOne/github-workflows/actions/account-provisioning@v4
        with:
          connector: ./baton-hubspot
          account-email: hs-test-user@mail.com
          account-profile: '{"email": "hs-test-user@mail.com", "first_name": "CI", "last_name": "Test", "send_welcome_email": false}'
          search-method: email
